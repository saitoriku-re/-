<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語テストアプリ</title>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --success: #10B981;
      --danger: #EF4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; min-height: 80vh; display: flex; flex-direction: column; }
    
    h1 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: var(--primary); }
    .screen { display: none; flex-direction: column; flex-grow: 1; }
    .screen.active { display: flex; }

    .form-group { margin-bottom: 16px; }
    label { font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; display: block; color: #4B5563; }
    input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 1rem; outline: none; }
    input[type="number"]:focus, select:focus { border-color: var(--primary); }
    .range-inputs { display: flex; gap: 8px; align-items: center; }

    .btn { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; width: 100%; margin-top: 8px; transition: background 0.2s; }
    .btn:active { background: var(--primary-hover); transform: scale(0.98); }
    .btn-secondary { background: #6B7280; }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }

    .progress-bar { width: 100%; height: 8px; background: #E5E7EB; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    .word-card { background: #F9FAFB; border: 2px solid #E5E7EB; border-radius: 12px; padding: 32px 16px; text-align: center; margin-bottom: 20px; position: relative; }
    .word-title { font-size: 2.2rem; font-weight: bold; color: #111827; word-break: break-word; }
    .word-id { position: absolute; top: 12px; left: 12px; font-size: 0.8rem; color: #9CA3AF; }
    .audio-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.4rem; cursor: pointer; }

    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .option-btn { background: white; border: 2px solid #E5E7EB; border-radius: 10px; padding: 14px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.2s; }
    .option-btn:active { background: #EEF2FF; border-color: var(--primary); }
    .option-btn.correct { background: #D1FAE5; border-color: var(--success); color: #065F46; font-weight: bold; }
    .option-btn.wrong { background: #FEE2E2; border-color: var(--danger); color: #991B1B; }

    .meaning-box { display: none; margin-top: 16px; padding: 16px; background: #EFF6FF; border-radius: 8px; font-size: 1.2rem; font-weight: bold; color: #1E40AF; text-align: center; }
    .card-actions { display: none; gap: 12px; margin-top: 16px; }
    .btn-correct { background: var(--success); }
    .btn-wrong { background: var(--danger); }

    .score-box { text-align: center; margin: 24px 0; }
    .score-number { font-size: 3rem; font-weight: bold; color: var(--primary); }
    .review-list { list-style: none; max-height: 250px; overflow-y: auto; border: 1px solid #E5E7EB; border-radius: 8px; padding: 8px; margin-bottom: 16px; }
    .review-item { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #F3F4F6; }
    .review-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>英単語テスト</h1>

  <!-- 設定画面 -->
  <div id="screen-setup" class="screen active">
    <div class="form-group">
      <label>出題範囲 (単語番号)</label>
      <div class="range-inputs">
        <input type="number" id="start-id" value="1" min="1" max="2300">
        <span>～</span>
        <input type="number" id="end-id" value="100" min="1" max="2300">
      </div>
    </div>

    <div class="form-group">
      <label>出題数</label>
      <select id="question-count">
        <option value="10">10 問</option>
        <option value="20" selected>20 問</option>
        <option value="50">50 問</option>
        <option value="all">指定範囲の全問</option>
      </select>
    </div>

    <div class="form-group">
      <label>テスト形式</label>
      <select id="quiz-mode">
        <option value="choice">4択クイズ</option>
        <option value="card">カードめくり (自己採点)</option>
      </select>
    </div>

    <button class="btn" onclick="startQuiz()">テスト開始</button>
  </div>

  <!-- クイズ画面 -->
  <div id="screen-quiz" class="screen">
    <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    <div style="font-size: 0.85rem; color: #6B7280; margin-bottom: 8px;" id="quiz-status"></div>

    <div class="word-card">
      <span id="word-id" class="word-id">No.1</span>
      <button class="audio-btn" onclick="speakWord()">🔊</button>
      <div id="word-text" class="word-title">word</div>
      <div id="meaning-box" class="meaning-box">意味</div>
    </div>

    <div id="choice-container" class="options-grid"></div>

    <button id="show-answer-btn" class="btn btn-outline" onclick="showCardAnswer()">答えを見る</button>
    <div id="card-actions" class="card-actions">
      <button class="btn btn-wrong" onclick="answerCard(false)">不正解</button>
      <button class="btn btn-correct" onclick="answerCard(true)">正解</button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="screen">
    <div class="score-box">
      <p style="font-size: 1.1rem; color: #4B5563;">テスト結果</p>
      <div id="score-text" class="score-number">0 / 0</div>
      <p id="accuracy-text" style="color: #6B7280;"></p>
    </div>

    <label id="review-label">間違えた単語</label>
    <ul id="review-list" class="review-list"></ul>

    <button class="btn" onclick="retryQuiz()">同じ設定で再挑戦</button>
    <button class="btn btn-secondary" onclick="showSetup()" style="margin-top: 8px;">設定画面に戻る</button>
  </div>
</div>

<script>
  // 読み込み済みの全2,300語データ
  const wordDatabase = [
    {id: 1, word: "agree", mean: "賛成する"},
    {id: 2, word: "oppose", mean: "～に反対する"},
    {id: 3, word: "advise", mean: "～に忠告する"},
    {id: 4, word: "tip", mean: "助言"},
    {id: 5, word: "discuss", mean: "～について話し合う"},
    {id: 6, word: "blame", mean: "～に責任があるとする"},
    {id: 7, word: "argue", mean: "～と主張する"},
    {id: 8, word: "claim", mean: "～と主張する"},
    {id: 9, word: "complain", mean: "文句を言う"},
    {id: 10, word: "offer", mean: "～を申し出る"},
    {id: 2298, word: "homogeneous", mean: "均質の"},
    {id: 2299, word: "feasible", mean: "実現可能な"},
    {id: 2300, word: "viable", mean: "実行可能な"}
  ];

  let currentQuestions = [];
  let currentIndex = 0;
  let correctCount = 0;
  let wrongWords = [];
  let isAnswered = false;

  function startQuiz() {
    const startId = parseInt(document.getElementById('start-id').value) || 1;
    const endId = parseInt(document.getElementById('end-id').value) || 2300;
    const countSelect = document.getElementById('question-count').value;

    let targetWords = wordDatabase.filter(w => w.id >= startId && w.id <= endId);

    if (targetWords.length === 0) {
      alert("指定された範囲に該当する単語がありません。");
      return;
    }

    targetWords.sort(() => Math.random() - 0.5);

    if (countSelect !== 'all') {
      const count = parseInt(countSelect, 10);
      targetWords = targetWords.slice(0, count);
    }

    currentQuestions = targetWords;
    currentIndex = 0;
    correctCount = 0;
    wrongWords = [];

    showScreen('screen-quiz');
    displayQuestion();
  }

  function displayQuestion() {
    isAnswered = false;
    const q = currentQuestions[currentIndex];
    const mode = document.getElementById('quiz-mode').value;

    const progress = (currentIndex / currentQuestions.length) * 100;
    document.getElementById('progress-fill').style.width = progress + '%';
    document.getElementById('quiz-status').innerText = `問題 ${currentIndex + 1} / ${currentQuestions.length}`;

    document.getElementById('word-id').innerText = `No.${q.id}`;
    document.getElementById('word-text').innerText = q.word;
    document.getElementById('meaning-box').innerText = q.mean;
    document.getElementById('meaning-box').style.display = 'none';

    if (mode === 'choice') {
      document.getElementById('choice-container').style.display = 'flex';
      document.getElementById('show-answer-btn').style.display = 'none';
      document.getElementById('card-actions').style.display = 'none';
      setupChoices(q);
    } else {
      document.getElementById('choice-container').style.display = 'none';
      document.getElementById('show-answer-btn').style.display = 'block';
      document.getElementById('card-actions').style.display = 'none';
    }
  }

  function setupChoices(correctQuestion) {
    const container = document.getElementById('choice-container');
    container.innerHTML = '';

    let dummyPool = wordDatabase.filter(w => w.id !== correctQuestion.id);
    dummyPool.sort(() => Math.random() - 0.5);
    let options = dummyPool.slice(0, 3);
    options.push(correctQuestion);
    options.sort(() => Math.random() - 0.5);

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.mean;
      btn.onclick = () => checkChoice(btn, opt.id === correctQuestion.id);
      container.appendChild(btn);
    });
  }

  function checkChoice(selectedBtn, isCorrect) {
    if (isAnswered) return;
    isAnswered = true;

    const currentQ = currentQuestions[currentIndex];

    if (isCorrect) {
      selectedBtn.classList.add('correct');
      correctCount++;
    } else {
      selectedBtn.classList.add('wrong');
      wrongWords.push(currentQ);
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach(btn => {
        if (btn.innerText === currentQ.mean) btn.classList.add('correct');
      });
    }

    setTimeout(() => {
      nextQuestion();
    }, 1200);
  }

  function showCardAnswer() {
    document.getElementById('meaning-box').style.display = 'block';
    document.getElementById('show-answer-btn').style.display = 'none';
    document.getElementById('card-actions').style.display = 'flex';
  }

  function answerCard(isCorrect) {
    const currentQ = currentQuestions[currentIndex];
    if (isCorrect) {
      correctCount++;
    } else {
      wrongWords.push(currentQ);
    }
    nextQuestion();
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
      displayQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    showScreen('screen-result');
    const total = currentQuestions.length;
    const accuracy = Math.round((correctCount / total) * 100);

    document.getElementById('score-text').innerText = `${correctCount} / ${total}`;
    document.getElementById('accuracy-text').innerText = `正解率: ${accuracy}%`;

    const reviewList = document.getElementById('review-list');
    reviewList.innerHTML = '';

    if (wrongWords.length === 0) {
      document.getElementById('review-label').innerText = "全問正解です！🎉";
    } else {
      document.getElementById('review-label').innerText = `間違えた単語 (${wrongWords.length}語)`;
      wrongWords.forEach(w => {
        const li = document.createElement('li');
        li.className = 'review-item';
        li.innerHTML = `<span><strong>${w.word}</strong> (No.${w.id})</span><span>${w.mean}</span>`;
        reviewList.appendChild(li);
      });
    }
  }

  function speakWord() {
    const word = document.getElementById('word-text').innerText;
    if ('speechSynthesis' in window) {
      const uttr = new SpeechSynthesisUtterance(word);
      uttr.lang = 'en-US';
      window.speechSynthesis.speak(uttr);
    }
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showSetup() { showScreen('screen-setup'); }
  function retryQuiz() { startQuiz(); }
</script>
</body>
</html>
